<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>To-Do List</h1>
      <p class="app__subtitle">A simple place to keep track of your tasks.</p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <label for="task-input" class="sr-only">New task</label>
      <input
        type="text"
        id="task-input"
        name="task"
        placeholder="What needs to be done?"
        maxlength="200"
        required
      >
      <button type="submit" class="btn btn--primary">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button class="filter is-active" data-filter="all" type="button">All</button>
      <button class="filter" data-filter="active" type="button">Active</button>
      <button class="filter" data-filter="completed" type="button">Completed</button>
    </div>

    <ul class="task-list" id="task-list" aria-live="polite"></ul>

    <div class="empty" id="empty-state" hidden>
      <p>No tasks to show.</p>
    </div>

    <footer class="app__footer">
      <span id="items-left" aria-live="polite">0 items left</span>
      <button id="clear-completed" class="link-btn" type="button">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
